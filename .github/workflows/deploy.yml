name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:  # ручной запуск из GitHub UI

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            cd ${{ secrets.VPS_PATH }}
            
            # Скачиваем свежий docker-compose.yml (на случай изменений)
            curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/main/docker-compose.yml" -o docker-compose.yml
            
            # Логинимся в GHCR для пулла приватного образа
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Пуллим новый образ
            docker compose pull
            
            # Перезапускаем контейнер
            docker compose up -d --remove-orphans
            
            # Чистим старые образы
            docker image prune -f
            
            echo "✅ Deploy completed!"

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Deployment failed!"
          # Можно добавить уведомление в Telegram/Slack здесь